openapi: "3.0.3"
info:
  title: DORA API
  version: "0.0.1"
  description: Incident management API for DORA compliance reporting.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Health check
      operationId: getHealth
      tags:
        - health
      security: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Unexpected server error

  /api/v1/auth/login:
    post:
      summary: Authenticate and receive a signed JWT
      operationId: login
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful — JWT returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/me:
    get:
      summary: Get authenticated user's profile
      operationId: getMe
      tags:
        - auth
      responses:
        "200":
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/logout:
    post:
      summary: Stateless logout — client must discard the token
      operationId: logout
      tags:
        - auth
      responses:
        "204":
          description: Logout acknowledged — no content
        "401":
          description: Missing or invalid bearer token

  /api/v1/auth/refresh:
    post:
      summary: Issue a new JWT using the current valid token (stateless re-issue)
      operationId: refreshToken
      tags:
        - auth
      responses:
        "200":
          description: New JWT issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Missing or invalid bearer token

  /api/v1/audit:
    get:
      summary: "FR-029: List audit history for an entity (read-only, bank roles only)"
      description: |
        Returns the append-only audit trail for a specific entity, newest row first.
        PLATFORM_ADMIN is explicitly excluded (BR-011, NFR-009).
        Permitted roles: OPS_ANALYST, INCIDENT_MANAGER, COMPLIANCE_OFFICER, CISO, BOARD_VIEWER.
      operationId: getAuditHistory
      tags:
        - audit
      parameters:
        - name: entity
          in: query
          required: true
          description: Entity type discriminator (e.g. INCIDENT, CLASSIFICATION, NCA_REPORT)
          schema:
            type: string
            example: INCIDENT
        - name: id
          in: query
          required: true
          description: UUID of the entity whose audit history is requested
          schema:
            type: string
            format: uuid
            example: "00000000-0000-0000-0000-000000000099"
        - name: page
          in: query
          required: false
          description: 0-based page index
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: Number of rows per page
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated audit history, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryPage"
        "400":
          description: Missing or invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have a permitted bank role (e.g. PLATFORM_ADMIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/incidents/_probe:
    get:
      summary: RBAC probe — accessible to bank roles only (PLATFORM_ADMIN blocked)
      operationId: incidentProbe
      tags:
        - incidents
      responses:
        "200":
          description: Caller has a permitted bank role
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "401":
          description: Not authenticated
        "403":
          description: Authenticated but role not permitted (e.g. PLATFORM_ADMIN)

  # ── LLD-05: Incident Logging endpoints (bank roles, BOARD_VIEWER excluded) ──

  /api/v1/incidents:
    post:
      summary: "AC-1: Create a new incident"
      description: |
        Creates an incident record. detection_datetime is stamped server-side (FR-002).
        A unique INC-YYYYMMDD-NNNN incidentId is assigned.
        Permitted: OPS_ANALYST, INCIDENT_MANAGER, COMPLIANCE_OFFICER, CISO.
        PLATFORM_ADMIN: 403. BOARD_VIEWER: 403 (deferred to LLD-14).
      operationId: createIncident
      tags:
        - incidents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
        "403":
          description: Role not permitted (PLATFORM_ADMIN or BOARD_VIEWER)
        "422":
          description: Business rule violation (e.g. inactive service ID supplied)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: "AC-6: List incidents (paginated, basic — rich search in LLD-14)"
      description: |
        Returns a paginated list of incidents for the authenticated user's tenant.
        Permitted: OPS_ANALYST, INCIDENT_MANAGER, COMPLIANCE_OFFICER, CISO.
        BOARD_VIEWER excluded (deferred to LLD-14).
      operationId: listIncidents
      tags:
        - incidents
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: createdAt,desc
      responses:
        "200":
          description: Paginated list of incident summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentSummaryPage"
        "401":
          description: Not authenticated
        "403":
          description: Role not permitted

  /api/v1/incidents/{id}:
    get:
      summary: "AC-6: Get full incident detail"
      description: |
        Returns full incident detail including attachments, linked services, and ICT assets.
        Permitted: OPS_ANALYST, INCIDENT_MANAGER, COMPLIANCE_OFFICER, CISO.
        BOARD_VIEWER excluded (deferred to LLD-14).
      operationId: getIncident
      tags:
        - incidents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Full incident detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "401":
          description: Not authenticated
        "403":
          description: Role not permitted
        "404":
          description: Incident not found (or belongs to a different tenant)

  /api/v1/incidents/{id}/attachments:
    post:
      summary: "AC-3: Request a presigned upload URL for an attachment"
      description: |
        Step 1 of 3 in the attachment flow: persists a PENDING metadata row and returns
        a presigned PUT URL (TTL=15 min per D-LLD05-2). The client PUTs the file directly
        to MinIO/S3, then calls /complete to confirm delivery.
        Permitted: OPS_ANALYST, INCIDENT_MANAGER.
      operationId: requestAttachmentUpload
      tags:
        - incidents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAttachmentUpload"
      responses:
        "201":
          description: Presigned URL issued; attachment row status=PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUploadResponse"
        "401":
          description: Not authenticated
        "403":
          description: Role not permitted
        "404":
          description: Incident not found
        "422":
          description: File size exceeds per-file cap (INCIDENT_ATTACHMENT_MAX_MB)

  /api/v1/incidents/{id}/attachments/{attachmentId}/complete:
    post:
      summary: "AC-3: Confirm upload completion, flip status to READY"
      description: |
        Step 3 of 3: verifies the object exists in storage (head request) and
        transitions attachment status from PENDING to READY.
        If the object is not found, status is set to FAILED and 422 is returned.
        Permitted: OPS_ANALYST, INCIDENT_MANAGER.
      operationId: completeAttachment
      tags:
        - incidents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attachment status=READY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
        "401":
          description: Not authenticated
        "403":
          description: Role not permitted
        "404":
          description: Attachment not found
        "422":
          description: Object not found in storage — upload failed or URL expired

  /api/v1/incidents/{id}/services:
    post:
      summary: "AC-4: Link active critical services to an incident"
      description: |
        Validates that each supplied UUID references an active critical_service for the
        tenant. Inactive or unknown IDs return 422.
        Permitted: OPS_ANALYST, INCIDENT_MANAGER.
      operationId: linkServices
      tags:
        - incidents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkServicesRequest"
      responses:
        "204":
          description: Services linked
        "401":
          description: Not authenticated
        "403":
          description: Role not permitted
        "404":
          description: Incident not found
        "422":
          description: One or more service IDs inactive or not found

  /api/v1/incidents/{id}/assets:
    post:
      summary: "AC-5: Link an ICT asset to an incident"
      description: |
        Creates an ict_asset row with a direct FK to the incident.
        Asset type is free-form — taxonomy defined at application layer.
        Permitted: OPS_ANALYST, INCIDENT_MANAGER.
      operationId: linkAsset
      tags:
        - incidents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkAssetRequest"
      responses:
        "201":
          description: ICT asset linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IctAssetResponse"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Role not permitted
        "404":
          description: Incident not found

  # ── LLD-04: Admin endpoints (PLATFORM_ADMIN only) ──────────────────────────

  /api/v1/admin/tenant:
    get:
      summary: Get the tenant's current configuration
      operationId: getAdminTenant
      tags:
        - admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenant configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfigDTO"
        "401":
          description: Not authenticated
        "403":
          description: Not PLATFORM_ADMIN
    put:
      summary: Update the tenant's configuration
      operationId: updateAdminTenant
      tags:
        - admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantConfigUpdateDTO"
      responses:
        "200":
          description: Updated tenant configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfigDTO"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Not PLATFORM_ADMIN

  /api/v1/admin/critical-services:
    get:
      summary: List all critical services (including archived)
      operationId: listCriticalServices
      tags:
        - admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of critical services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CriticalServiceDTO"
        "401":
          description: Not authenticated
        "403":
          description: Not PLATFORM_ADMIN
    post:
      summary: Create a new critical service
      operationId: createCriticalService
      tags:
        - admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCriticalServiceDTO"
      responses:
        "201":
          description: Critical service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriticalServiceDTO"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Not PLATFORM_ADMIN
        "409":
          description: Service name already exists for this tenant

  /api/v1/admin/critical-services/{id}:
    put:
      summary: Update a critical service
      operationId: updateCriticalService
      tags:
        - admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCriticalServiceDTO"
      responses:
        "200":
          description: Updated critical service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriticalServiceDTO"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Not PLATFORM_ADMIN
        "404":
          description: Service not found
        "409":
          description: Service name already exists

  /api/v1/admin/critical-services/{id}/archive:
    post:
      summary: Archive a critical service (sets active=false)
      operationId: archiveCriticalService
      tags:
        - admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Service archived
        "401":
          description: Not authenticated
        "403":
          description: Not PLATFORM_ADMIN
        "404":
          description: Service not found

  /api/v1/admin/client-base:
    get:
      summary: Get client base history (most recent first)
      operationId: getClientBaseHistory
      tags:
        - admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Client base history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBaseHistoryDTO"
        "401":
          description: Not authenticated
        "403":
          description: Not PLATFORM_ADMIN
    post:
      summary: Append a new client base count entry
      operationId: addClientBaseEntry
      tags:
        - admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetClientBaseDTO"
      responses:
        "201":
          description: Client base entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBaseEntryDTO"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Not PLATFORM_ADMIN

  /api/v1/admin/nca-email:
    get:
      summary: Get NCA email configuration
      operationId: getNcaEmailConfig
      tags:
        - admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: NCA email configuration (empty if not yet configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NcaEmailConfigDTO"
        "401":
          description: Not authenticated
        "403":
          description: Not PLATFORM_ADMIN
    put:
      summary: Create or update NCA email configuration
      operationId: updateNcaEmailConfig
      tags:
        - admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NcaEmailConfigUpdateDTO"
      responses:
        "200":
          description: Updated NCA email configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NcaEmailConfigDTO"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Not PLATFORM_ADMIN

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
        - timestamp
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
          example: "0.0.1"
        timestamp:
          type: string
          format: date-time
          example: "2026-04-24T10:00:00Z"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: ops@dora.local
        password:
          type: string
          format: password
          example: ChangeMe!23

    LoginResponse:
      type: object
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          description: Signed HMAC-SHA256 JWT
          example: eyJhbGciOiJIUzI1NiJ9...
        expiresAt:
          type: string
          format: date-time
          example: "2026-04-24T11:00:00Z"
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required:
        - email
        - roles
        - tenantId
        - mfaEnabled
      properties:
        email:
          type: string
          format: email
          example: ops@dora.local
        roles:
          type: array
          items:
            type: string
          example: ["OPS_ANALYST"]
        tenantId:
          type: string
          format: uuid
          example: "00000000-0000-0000-0000-000000000001"
        mfaEnabled:
          type: boolean
          example: false

    AuditEntry:
      type: object
      description: Single row from the append-only audit_log table (LLD-03 §5)
      properties:
        id:
          type: string
          format: uuid
          example: "aaaaaaaa-0000-0000-0000-000000000001"
        tenantId:
          type: string
          format: uuid
          example: "00000000-0000-0000-0000-000000000001"
        actorId:
          type: string
          format: uuid
          nullable: true
          description: NULL for SYSTEM actions
          example: "00000000-0000-0000-0001-000000000002"
        actorUsername:
          type: string
          example: ops@dora.local
        action:
          type: string
          example: INCIDENT_CREATED
        entityType:
          type: string
          example: INCIDENT
        entityId:
          type: string
          format: uuid
          nullable: true
          description: NULL for non-entity events
          example: "00000000-0000-0000-0000-000000000099"
        beforeState:
          type: object
          nullable: true
          description: JSON snapshot of the entity before the change; null on creation events
        afterState:
          type: object
          nullable: true
          description: JSON snapshot of the entity after the change; null on deletion events
        context:
          type: object
          nullable: true
          description: "Forensic context: request_id, remote_ip, user_agent only (Q-2 ruling)"
          properties:
            request_id:
              type: string
              nullable: true
            remote_ip:
              type: string
              nullable: true
            user_agent:
              type: string
              nullable: true
        createdAt:
          type: string
          format: date-time
          example: "2026-04-25T10:00:00Z"

    AuditEntryPage:
      type: object
      description: Spring Page wrapper for AuditEntry (pagination metadata + content array)
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    ErrorResponse:
      type: object
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
          example: Invalid credentials
        timestamp:
          type: string
          format: date-time
          example: "2026-04-24T10:00:00Z"

    # ── LLD-05: Incident schemas ───────────────────────────────────────────────

    CreateIncidentRequest:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          maxLength: 200
          example: "Payments Rail Outage"
        description:
          type: string
          example: "Core payments rail is unresponsive since 09:45 UTC"
        impactEstimate:
          type: string
          nullable: true
          example: "High impact — all payment processing halted"
        serviceIds:
          type: array
          items:
            type: string
            format: uuid
          description: Active critical_service UUIDs (AC-4). Empty list is valid.
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AssetRequest"
          description: Inline ICT assets to link at creation time (AC-5).

    AssetRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          maxLength: 200
          example: "Payment Gateway Server"
        type:
          type: string
          maxLength: 100
          example: "SERVER"

    IncidentResponse:
      type: object
      description: Full incident detail including linked entities
      properties:
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          example: "INC-20260507-0001"
          description: Human-readable incident ID in INC-YYYYMMDD-NNNN format
        title:
          type: string
        description:
          type: string
        impactEstimate:
          type: string
          nullable: true
        detectionDatetime:
          type: string
          format: date-time
          description: Server-stamped immutable timestamp (FR-002, D-LLD05-1)
        status:
          type: string
          enum: [DETECTED, UNDER_ASSESSMENT, CLASSIFIED, ONGOING, RESOLVED]
          example: DETECTED
        tenantId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentResponse"
        services:
          type: array
          items:
            $ref: "#/components/schemas/LinkedServiceResponse"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/IctAssetResponse"

    IncidentSummary:
      type: object
      description: Compact projection for paginated list endpoint
      properties:
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          example: "INC-20260507-0001"
        title:
          type: string
        status:
          type: string
          enum: [DETECTED, UNDER_ASSESSMENT, CLASSIFIED, ONGOING, RESOLVED]
        detectionDatetime:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        tenantId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid

    IncidentSummaryPage:
      type: object
      description: Spring Page wrapper for IncidentSummary
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/IncidentSummary"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    RequestAttachmentUpload:
      type: object
      required:
        - filename
        - contentType
        - sizeBytes
      properties:
        filename:
          type: string
          maxLength: 500
          example: "evidence.pdf"
        contentType:
          type: string
          maxLength: 200
          example: "application/pdf"
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          example: 1048576
          description: File size in bytes; must be > 0 and ≤ INCIDENT_ATTACHMENT_MAX_MB limit

    PresignedUploadResponse:
      type: object
      description: Presigned PUT URL + attachment metadata (AC-3)
      properties:
        attachmentId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT URL; valid for 15 minutes (D-LLD05-2)
        expiresAt:
          type: string
          format: date-time

    AttachmentResponse:
      type: object
      description: Attachment metadata (returned in incident detail and after /complete)
      properties:
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        s3Key:
          type: string
          description: Object key in the S3/MinIO bucket
        status:
          type: string
          enum: [PENDING, READY, FAILED]
        uploadedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    LinkedServiceResponse:
      type: object
      description: Summary of a linked critical service
      properties:
        serviceId:
          type: string
          format: uuid
        name:
          type: string

    LinkServicesRequest:
      type: object
      required:
        - serviceIds
      properties:
        serviceIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: Active critical_service UUIDs to link to the incident

    LinkAssetRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          maxLength: 200
          example: "Core Router EU-WEST-1"
        type:
          type: string
          maxLength: 100
          example: "NETWORK_DEVICE"

    IctAssetResponse:
      type: object
      description: ICT asset linked to an incident
      properties:
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── LLD-04: Admin schemas ──────────────────────────────────────────────────

    TenantConfigDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
        lei:
          type: string
        ncaName:
          type: string
        ncaEmail:
          type: string
        jurisdictionIso:
          type: string
          maxLength: 2
        primaryComplianceContactId:
          type: string
          format: uuid

    TenantConfigUpdateDTO:
      type: object
      required:
        - legalName
      properties:
        legalName:
          type: string
        lei:
          type: string
          pattern: "^[A-Z0-9]{20}$"
        ncaName:
          type: string
        ncaEmail:
          type: string
          format: email
        jurisdictionIso:
          type: string
          minLength: 2
          maxLength: 2
        primaryComplianceContactId:
          type: string
          format: uuid

    CriticalServiceDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateCriticalServiceDTO:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string

    UpdateCriticalServiceDTO:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string

    ClientBaseHistoryDTO:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ClientBaseEntryDTO"

    ClientBaseEntryDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        clientCount:
          type: integer
          format: int64
        effectiveFrom:
          type: string
          format: date-time
        setBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    SetClientBaseDTO:
      type: object
      required:
        - clientCount
        - effectiveFrom
      properties:
        clientCount:
          type: integer
          format: int64
          minimum: 0
        effectiveFrom:
          type: string
          format: date-time

    NcaEmailConfigDTO:
      type: object
      properties:
        sender:
          type: string
        recipient:
          type: string
        subjectTemplate:
          type: string

    NcaEmailConfigUpdateDTO:
      type: object
      required:
        - sender
        - recipient
        - subjectTemplate
      properties:
        sender:
          type: string
          format: email
        recipient:
          type: string
          format: email
        subjectTemplate:
          type: string
          maxLength: 500
