spring:
  datasource:
    # Driver must be explicit so Spring Boot does not fall back to H2 auto-detection
    # when no URL is present in the static config (URL is injected via @DynamicPropertySource).
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
  api-docs:
    path: /v3/api-docs

# AWS S3 / MinIO — test defaults. Tests that mock ObjectStorageClient override these.
# Tests that need real S3 behaviour should use Testcontainers with a MinIO container.
aws:
  s3:
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: dora-local
    access-key: minioadmin
    secret-key: minioadmin

# Incident attachment cap — test default (same as production default)
incident:
  attachment:
    max-mb: 50

# DevJwtService — test values; never commit real secrets here.
dora:
  jwt:
    secret: test-secret-change-me-min-32-chars-here
    ttl-minutes: 60
    clock-skew-seconds: 60
